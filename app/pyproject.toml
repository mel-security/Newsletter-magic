[project]
name = "cyber-news-agent"
version = "0.1.0"
description = "Autonomous cybersecurity newsletter agent with Devil Twins LLM pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "feedparser>=6.0.11",
    "trafilatura>=2.0.0",
    "simhash>=2.1.2",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "structlog>=24.4.0",
    "python-multipart>=0.0.17",
    "aiosmtplib>=3.0.2",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
